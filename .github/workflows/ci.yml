name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck tmux
      - name: Shellcheck
        run: shellcheck -S warning loopkit kit/*.sh tests/run-tests.sh examples/notify/*.sh examples/remote-watch/loopkit-watch
      - name: Python syntax
        run: python3 -m py_compile kit/roadmap/*.py tests/mock-claude.py
      - name: Harness tests (fake Claude, no network)
        run: tests/run-tests.sh
