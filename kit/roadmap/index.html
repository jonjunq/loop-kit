<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // Theme before first paint: saved choice > system
  (function () {
    var t = null; try { t = JSON.parse(localStorage.getItem("roadmap:theme")); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 22px;
    /* dark by default */
    --bg: #07080c; --text: #f3f3f6; --muted: rgba(255,255,255,.56); --faint: rgba(255,255,255,.32);
    --glass: rgba(255,255,255,.055); --glass-2: rgba(255,255,255,.085); --glass-hi: rgba(255,255,255,.13);
    --stroke: rgba(255,255,255,.10); --stroke-2: rgba(255,255,255,.16); --grid: rgba(255,255,255,.055);
    --shadow: 0 20px 60px -20px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.08);
    --blob-1: rgba(255,138,61,.30); --blob-2: rgba(118,87,255,.30); --blob-3: rgba(20,200,180,.16); --blob-4: rgba(255,90,140,.14);
    --done: #34d399; --done-2: #10b981; --fail: #fbbf24; --blocked: #f87171; --run: #a78bfa; --run-2: #7c5cff;
    --accent: #5b8cff; --accent-2: #8fb0ff; --todo: rgba(255,255,255,.14); --nowline: #ff5c6c; --idle: rgba(255,255,255,.28);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #efece6; --text: #17171d; --muted: rgba(20,20,30,.58); --faint: rgba(20,20,30,.35);
      --glass: rgba(255,255,255,.52); --glass-2: rgba(255,255,255,.68); --glass-hi: rgba(255,255,255,.85);
      --stroke: rgba(255,255,255,.75); --stroke-2: rgba(20,20,30,.10); --grid: rgba(20,20,30,.065);
      --shadow: 0 18px 50px -24px rgba(60,40,20,.35), inset 0 1px 0 rgba(255,255,255,.9);
      --blob-1: rgba(255,170,110,.45); --blob-2: rgba(150,130,255,.38); --blob-3: rgba(90,210,190,.30); --blob-4: rgba(255,140,170,.25);
      --done: #12a46b; --done-2: #0c8a59; --fail: #d98b00; --blocked: #dc4a4a; --run: #7c5cff; --run-2: #6244ea;
      --accent: #3a6cf0; --accent-2: #6d93f5; --todo: rgba(20,20,30,.10); --nowline: #e5484d; --idle: rgba(20,20,30,.25);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #efece6; --text: #17171d; --muted: rgba(20,20,30,.58); --faint: rgba(20,20,30,.35);
    --glass: rgba(255,255,255,.52); --glass-2: rgba(255,255,255,.68); --glass-hi: rgba(255,255,255,.85);
    --stroke: rgba(255,255,255,.75); --stroke-2: rgba(20,20,30,.10); --grid: rgba(20,20,30,.065);
    --shadow: 0 18px 50px -24px rgba(60,40,20,.35), inset 0 1px 0 rgba(255,255,255,.9);
    --blob-1: rgba(255,170,110,.45); --blob-2: rgba(150,130,255,.38); --blob-3: rgba(90,210,190,.30); --blob-4: rgba(255,140,170,.25);
    --done: #12a46b; --done-2: #0c8a59; --fail: #d98b00; --blocked: #dc4a4a; --run: #7c5cff; --run-2: #6244ea;
    --accent: #3a6cf0; --accent-2: #6d93f5; --todo: rgba(20,20,30,.10); --nowline: #e5484d; --idle: rgba(20,20,30,.25);
    color-scheme: light;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button { font: inherit; color: inherit; }
  /* Backdrop: fixed, blurred colour lights */
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); }
  .backdrop i { position: absolute; border-radius: 50%; filter: blur(90px); }
  .backdrop i:nth-child(1) { width: 52vw; height: 52vw; left: -12vw; top: -18vw; background: var(--blob-1); }
  .backdrop i:nth-child(2) { width: 46vw; height: 46vw; right: -10vw; top: 6vh; background: var(--blob-2); }
  .backdrop i:nth-child(3) { width: 40vw; height: 40vw; left: 30vw; bottom: -22vw; background: var(--blob-3); }
  .backdrop i:nth-child(4) { width: 28vw; height: 28vw; right: 18vw; bottom: 6vh; background: var(--blob-4); }

  .glass { background: var(--glass); border: 1px solid var(--stroke); border-radius: var(--radius); box-shadow: var(--shadow); }
  .page { max-width: 1880px; margin: 0 auto; padding: 18px clamp(16px, 2.2vw, 40px) 56px; }

  /* ---------- Navigation ---------- */
  nav.top { backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); background: color-mix(in srgb, var(--bg) 55%, transparent); }
  nav.top { position: sticky; top: 12px; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 999px; margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 4px; font-weight: 700; letter-spacing: -.01em; font-size: 15px; white-space: nowrap; }
  .brand-ring { width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(from 210deg, #ff8a3d, var(--run), var(--accent), var(--done), #ff8a3d);
    -webkit-mask: radial-gradient(circle, transparent 7px, #000 7.5px); mask: radial-gradient(circle, transparent 7px, #000 7.5px); }
  .navlinks { display: flex; gap: 4px; margin: 0 auto; }
  .navlinks a { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .navlinks a:hover { color: var(--text); background: var(--glass-2); }
  .navlinks a.on { color: var(--text); background: var(--glass-hi); border-color: var(--stroke); }
  .navright { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--stroke); white-space: nowrap; }
  .status .led { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .status.on .led { background: var(--done); animation: led 2s infinite; }
  @keyframes led { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--done) 60%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .round { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-2); border: 1px solid var(--stroke); cursor: pointer; }
  .round:hover { background: var(--glass-hi); }
  .round svg { width: 16px; height: 16px; }

  /* ---------- Header ---------- */
  .hello { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin: 0 4px 22px; }
  .hello h1 { font-size: clamp(24px, 2.2vw, 34px); font-weight: 650; letter-spacing: -.025em; margin: 0; }
  .hello p { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }
  .hello p b { color: var(--text); font-weight: 600; }
  .updated { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 8px; }
  .updated .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--done); opacity: .25; transition: opacity .6s; }
  .updated .pulse.on { opacity: 1; transition: none; }

  /* ---------- Grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
  .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; }
  .card { padding: 20px 22px; min-width: 0; position: relative; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .card .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .section-gap { height: 18px; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
  .kpi { position: relative; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: transform .25s, background .25s; }
  .kpi:hover { transform: translateY(-3px); background: var(--glass-2); }
  .kpi .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--glass-2); border: 1px solid var(--stroke); }
  .kpi .ic svg { width: 16px; height: 16px; }
  .kpi .l { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .kpi .v { font-size: clamp(20px, 1.6vw, 27px); font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .badges { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
    background: color-mix(in srgb, var(--done) 16%, transparent); color: var(--done); }
  .badge.muted { background: var(--glass-2); color: var(--muted); }
  .badge.warn { background: color-mix(in srgb, var(--fail) 18%, transparent); color: var(--fail); }
  .spark { width: 110px; height: 38px; flex: none; overflow: visible; }
  .kpi .spark { position: absolute; top: 16px; right: 18px; width: min(110px, 45%); }

  /* Segmented controls */
  .seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; padding: 3px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--stroke); }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg.lang button { padding: 5px 9px; font-size: 11.5px; font-weight: 600; letter-spacing: .03em; }
  .seg button[aria-pressed="true"] { background: var(--glass-hi); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.12); }
  .pillbtn { border: 1px solid var(--stroke); background: var(--glass-2); padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .pillbtn:hover, .pillbtn[aria-pressed="true"] { color: var(--text); background: var(--glass-hi); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type=search] { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--stroke); background: var(--glass-2);
    color: var(--text); width: 200px; min-width: 0; outline: none; }
  input[type=search]:focus { border-color: var(--accent); }
  input[type=search]::placeholder { color: var(--faint); }

  /* ---------- Gantt ---------- */
  .gantt-card { display: flex; flex-direction: column; padding-bottom: 14px; }
  .gantt { height: clamp(460px, 64vh, 760px); overflow: auto; position: relative; border-radius: 14px; border: 1px solid var(--stroke);
    background: color-mix(in srgb, var(--glass) 60%, transparent); }
  .g-inner { position: relative; min-width: 100%; }
  .g-row { display: flex; height: 32px; border-bottom: 1px solid var(--grid); }
  .g-row.blockhead { height: 36px; cursor: pointer; background: color-mix(in srgb, var(--glass-2) 70%, transparent); }
  .g-label { position: sticky; left: 0; z-index: 2; flex: 0 0 var(--lw); width: var(--lw); padding: 0 14px; display: flex; align-items: center; gap: 9px;
    font-size: 13px; white-space: nowrap; overflow: hidden; border-right: 1px solid var(--stroke);
    background: var(--bg); }
  .g-row.blockhead .g-label { font-weight: 650; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .g-row.blockhead .g-label .cnt { margin-left: auto; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .chev { display: inline-block; width: 10px; color: var(--muted); transition: transform .15s; }
  .collapsed .chev { transform: rotate(-90deg); }
  .fid { font-family: var(--mono); color: var(--faint); font-size: 11.5px; flex: none; }
  .g-label .txt { overflow: hidden; text-overflow: ellipsis; }
  .g-row.done .g-label .txt { color: var(--muted); }
  .g-row.blocked .g-label .txt { text-decoration: line-through; color: var(--blocked); }
  .g-row:not(.blockhead):hover { background: var(--grid); }
  .g-track { position: relative; flex: none; }
  .g-head { position: sticky; top: 0; z-index: 3; display: flex; height: 50px; border-bottom: 1px solid var(--stroke);
    background: var(--bg); }
  .g-head .g-label { z-index: 4; font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; align-items: flex-end; padding-bottom: 9px; }
  .tick { position: absolute; top: 0; bottom: 0; }
  .tick span { position: absolute; left: 0; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; bottom: 8px; font-variant-numeric: tabular-nums; }
  .tick.day span { transform: none; left: 8px; top: 6px; bottom: auto; font-weight: 650; color: var(--text); text-transform: uppercase; font-size: 10.5px; letter-spacing: .07em; }
  .gridlines, .overlay { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 0; }
  .overlay { z-index: 1; }
  .pauseband { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--blocked) 14%, transparent) 0 6px, transparent 6px 12px); border-left: 1px dashed color-mix(in srgb, var(--blocked) 60%, transparent); }
  .pausetag { position: absolute; top: 3px; transform: translateX(4px); font-size: 10.5px; font-weight: 600; color: var(--blocked); white-space: nowrap; }
  .gl { position: absolute; top: 50px; bottom: 0; border-left: 1px solid var(--grid); }
  .gl.day { border-left-color: var(--stroke-2); }
  .nowline { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px;
    background: linear-gradient(var(--nowline), color-mix(in srgb, var(--nowline) 15%, transparent)); box-shadow: 0 0 14px var(--nowline); }
  .nowtag { position: absolute; top: 25px; transform: translateX(-50%); background: var(--nowline); color: #fff; font-size: 10px;
    font-weight: 700; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; z-index: 4; pointer-events: none; box-shadow: 0 0 16px color-mix(in srgb, var(--nowline) 60%, transparent); }
  .ev { position: absolute; top: 50px; bottom: 0; border-left: 1px dashed var(--fail); opacity: .45; }
  .bar { position: absolute; top: 8px; height: 16px; border-radius: 6px; min-width: 4px; display: flex; overflow: hidden; }
  .bar > i { height: 100%; display: block; }
  .bar.pass { box-shadow: 0 0 14px -2px color-mix(in srgb, var(--done) 55%, transparent); }
  .bar.pass > i { background: linear-gradient(180deg, color-mix(in srgb, var(--done) 75%, #fff), var(--done)); }
  .bar.fail > i, .bar.qa_inconclusive > i { background: linear-gradient(180deg, color-mix(in srgb, var(--fail) 75%, #fff), var(--fail)); }
  .bar > i + i { box-shadow: inset 1.5px 0 0 color-mix(in srgb, var(--bg) 75%, transparent); }  /* separates worker | verify | QA */
  .bar.jr { border-top-right-radius: 0; border-bottom-right-radius: 0; }   /* back-to-back runs of the same feature: one bar */
  .bar.jl { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0; box-shadow: inset 1.5px 0 0 color-mix(in srgb, var(--bg) 75%, transparent); }
  .bar.interrupted > i { background: var(--idle); }
  .bar.running { background: repeating-linear-gradient(-45deg, var(--run) 0 7px, var(--run-2) 7px 14px); background-size: 200% 100%;
    animation: stripes 1.2s linear infinite; box-shadow: 0 0 18px color-mix(in srgb, var(--run) 70%, transparent); }
  @keyframes stripes { to { background-position: -40px 0; } }
  @media (prefers-reduced-motion: reduce) { .bar.running, .status.on .led { animation: none; } }
  .bar.est { background: var(--glass-2); border: 1px solid var(--stroke-2); }
  .bar.est.next { border-color: var(--run); background: color-mix(in srgb, var(--run) 14%, transparent); }
  .blab { position: absolute; top: 7px; font-size: 12.5px; white-space: nowrap; color: var(--text); pointer-events: none; }
  .blab .m { color: var(--muted); }
  .g-row.done .blab { color: var(--muted); }
  .span { position: absolute; top: 13px; height: 9px; border-radius: 999px; display: flex; overflow: hidden; background: var(--todo); }
  .span i { display: block; height: 100%; }
  .nodate { position: absolute; top: 8px; font-size: 12px; color: var(--blocked); white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); align-items: center; margin-top: 12px; }
  .sw { display: inline-block; width: 18px; height: 9px; border-radius: 3px; margin-right: 7px; vertical-align: 0; }

  /* ---------- Now ---------- */
  .now-card { display: flex; flex-direction: column; gap: 22px; }
  .now-id { font-family: var(--mono); font-size: 12px; color: var(--run); }
  .now-title { font-size: 19px; font-weight: 650; letter-spacing: -.015em; margin: 2px 0 4px; }
  .now-block { font-size: 12.5px; color: var(--muted); }
  .timer { font-size: 38px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .timer small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .phase { padding: 9px 10px; border-radius: 12px; background: var(--glass-2); border: 1px solid var(--stroke); font-size: 12px; color: var(--muted); }
  .phase b { display: block; color: var(--text); font-size: 12.5px; font-weight: 600; }
  .phase.done { border-color: color-mix(in srgb, var(--done) 40%, transparent); }
  .phase.done b::before { content: "✓ "; color: var(--done); }
  .phase.on { border-color: var(--run); background: color-mix(in srgb, var(--run) 16%, transparent); }
  .phase.on b::before { content: "● "; color: var(--run); }
  .progress-line { height: 6px; border-radius: 999px; background: var(--todo); overflow: hidden; }
  .progress-line i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--run-2), var(--run)); }
  .muted-s { font-size: 12.5px; color: var(--muted); }
  /* ---------- Blocks (rings) ---------- */
  .rings { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .ringc { padding: 10px 6px 8px; border-radius: 16px; background: var(--glass-2); border: 1px solid var(--stroke); text-align: center; cursor: pointer; transition: background .2s, transform .2s; min-width: 0; }
  .ringc:hover { background: var(--glass-hi); transform: translateY(-2px); }
  .ringc.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .ringc svg { width: 50px; height: 50px; display: block; margin: 0 auto 6px; overflow: visible; }
  .ringc .n { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ringc .c { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Activity ---------- */
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .feed li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
  .feed li:last-child { border-bottom: 0; }
  .feed .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .feed .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed .tx small { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
  .feed .ago { font-size: 11.5px; color: var(--faint); white-space: nowrap; }

  .note { color: var(--fail); white-space: pre-wrap; margin-top: 8px; }

  /* ---------- Feature drawer ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(560px, calc(100vw - 24px)); z-index: 41; background: var(--bg);
    border: 1px solid var(--stroke-2); border-radius: 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); display: flex; flex-direction: column;
    transform: translateX(calc(100% + 24px)); transition: transform .25s ease; overflow: hidden; }
  .drawer.on { transform: none; }
  .drawer .dh { padding: 20px 22px 14px; border-bottom: 1px solid var(--grid); display: flex; gap: 12px; align-items: flex-start; }
  .drawer .dh h3 { margin: 2px 0 6px; font-size: 19px; font-weight: 650; letter-spacing: -.015em; }

  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const d = await r.json();
    // Leave out of the key what changes on its own (agent jsonl mtime, guard heartbeat): otherwise everything redraws every second
    const u = d.usage || {};
    const key = JSON.stringify({ ...d, now: 0, usage: { ...u, latest: u.latest && { ...u.latest, mtime: 0 }, guard: u.guard && { ...u.guard, updated: 0 } } });
    data = d; lastOk = Date.now(); failed = false;
    // Full redraw only on new data or every 5 min (refreshes estimates); clock-driven bits are moved by tickNow()
    if (key !== lastKey || lastOk - lastRender > 300e3) { lastKey = key; lastRender = lastOk; render(); }
    else { tickNow(); renderTop(); }
    const p = $("pulse"); p.classList.add("on"); requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove("on")));
    $("updated").textContent = t("updated", fmtHMS.format(data.now));
  } catch (e) {
    failed = true; const st = $("status"); st.className = "status"; st.querySelector(".txt").textContent = t("stOffline");
    if (lastOk) $("updated").textContent = t("offline", fmtHMS.format(lastOk));
  } finally { inflight = false; }
}

$("hideDone").onclick = e => { hideDone = !hideDone; store.set("hideDone", hideDone); e.currentTarget.setAttribute("aria-pressed", String(hideDone)); render(); };
$("goNow").onclick = () => scrollToNow();
const page = dir => { const g = $("ganttBox"); g.scrollBy({ left: dir * (g.clientWidth - (G?.lw || 0)) * 0.5, behavior: "smooth" }); };
$("prev").onclick = () => page(-1); $("next").onclick = () => page(1);
$("gq").oninput = render;
const saveCol = () => store.set("collapsed", [...collapsed]);
$("toggleAll").onclick = () => { if (collapsed.size) collapsed.clear(); else groupsOf(data?.features || []).forEach((_, k) => collapsed.add(k)); saveCol(); render(); };
$("ginner").addEventListener("click", e => { const r = e.target.closest(".g-row[data-id]"); if (r) return openFeature(r.dataset.id); const h = e.target.closest(".blockhead"); if (!h) return; const b = h.dataset.block; collapsed.has(b) ? collapsed.delete(b) : collapsed.add(b); saveCol(); render(); });
$("rings").onclick = e => { const el = e.target.closest(".ringc"); if (!el) return; block = block === el.dataset.b ? null : el.dataset.b; render(); };
$("rings").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.target.click(); } };
$("drawer").addEventListener("click", e => { const c = e.target.closest("[data-open]"); if (c) return openFeature(c.dataset.open); if (e.target.closest("#drawerClose")) closeFeature(); });
$("scrim").onclick = closeFeature;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeFeature(); });
// Highlight the visible section in the nav
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) document.querySelectorAll(".navlinks a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + en.target.id)); }),
  { rootMargin: "-30% 0px -60% 0px" });
["resumen", "gantt", "bloques", "registro"].forEach(id => io.observe($(id)));
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });

load(); setInterval(load, 1000);
</script>
</body>
</html>
